name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Instalar dependencias
        run: uv sync --locked

      - name: Lint
        run: make lint

      - name: Pruebas unitarias
        run: make test

      # M5 no se puede descargar sin credenciales: el pipeline corre sobre un mini-M5 sintético.
      # (El contexto `runner` no existe en `env` a nivel de job; por eso se fija aquí.)
      - name: Pipeline completo sobre datos sintéticos
        run: |
          export DFI_DATA_DIR="$RUNNER_TEMP/dfi-data"
          make synthetic
          make all
