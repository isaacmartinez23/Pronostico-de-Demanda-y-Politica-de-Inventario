[project]
name = "demand-forecasting-inventory"
version = "0.1.0"
description = "Pronóstico de demanda por SKU-tienda (M5 Walmart) y política de inventario: safety stock, punto de reorden y cantidad a pedir."
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Isaac Martínez" }]
dependencies = [
    "pandas>=2.2",
    # numpy 2.5 + pandas 2.x emite DeprecationWarning en la aritmética de fechas
    "numpy>=1.26,<2.5",
    "pyarrow>=16",
    "duckdb>=1.0",
    "scipy>=1.13",
    "statsforecast>=2.0",
    "mlforecast>=1.0",
    "lightgbm>=4.3",
    "matplotlib>=3.9",
    "plotly>=5.22",
    "streamlit>=1.37",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pre-commit>=3.7",
    "jupyter>=1.0",
    "jupytext>=1.16",
    "nbconvert>=7.16",
    "ipykernel>=6.29",
    "kaggle>=1.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.py" = ["E402", "B018"]
